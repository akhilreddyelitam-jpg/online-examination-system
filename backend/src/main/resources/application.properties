server.port=8080

# Database Configuration (Defaults to running local MySQL on port 3306, configurable via env DB_PORT / DB_HOST)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/online_exam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.onlineexam=INFO
logging.level.org.springframework.security=WARN
